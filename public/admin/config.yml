backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "fr"

collections:
  - name: "profil"
    label: "Profil & Présentation"
    files:
      - name: "profil"
        label: "Profil"
        file: "src/content/profil.json"
        fields:
          - { label: "Nom complet", name: "nom", widget: "string" }
          - { label: "Titre professionnel", name: "titre", widget: "string" }
          - { label: "Présentation (texte libre)", name: "presentation", widget: "text" }
          - { label: "Photo de profil", name: "photo", widget: "image", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Téléphone 1", name: "telephone1", widget: "string" }
          - { label: "Téléphone 2", name: "telephone2", widget: "string", required: false }
          - { label: "Lien WhatsApp", name: "whatsapp", widget: "string", required: false }
          - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
          - { label: "CV PDF", name: "cv_pdf", widget: "file", required: false }

  - name: "poles"
    label: "Pôles de compétences"
    folder: "src/content/poles"
    create: true
    fields:
      - { label: "Titre du pôle", name: "titre", widget: "string" }
      - { label: "Emoji / icône", name: "icone", widget: "string", default: "⭐" }
      - { label: "Description courte", name: "description", widget: "text" }
      - { label: "Points clés (liste)", name: "points_cles", widget: "list", field: { label: "Point", name: "valeur", widget: "string" } }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 0 }

  - name: "experiences"
    label: "Parcours professionnel"
    folder: "src/content/experiences"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: "Poste", name: "poste", widget: "string" }
      - { label: "Structure", name: "structure", widget: "string" }
      - { label: "Période (ex: 2024–2025)", name: "periode", widget: "string" }
      - { label: "Missions", name: "missions", widget: "text" }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 0 }

  - name: "formations"
    label: "Formations académiques"
    folder: "src/content/formations"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: "Diplôme / Intitulé", name: "intitule", widget: "string" }
      - { label: "Établissement", name: "etablissement", widget: "string" }
      - { label: "Année", name: "annee", widget: "string" }
      - { label: "En cours ?", name: "en_cours", widget: "boolean", default: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 0 }

  - name: "competences"
    label: "Compétences"
    folder: "src/content/competences"
    create: true
    fields:
      - { label: "Nom de la compétence", name: "nom", widget: "string" }
      - label: "Catégorie"
        name: "categorie"
        widget: "select"
        options: ["Marketing et communication digitale", "Création de contenu", "Outils numériques", "Sport et encadrement"]

  - name: "certifications"
    label: "Certifications & formations complémentaires"
    folder: "src/content/certifications"
    create: true
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Organisme", name: "organisme", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "string", required: false }
      - { label: "Image ou document", name: "fichier", widget: "file", required: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 0 }

  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    fields:
      - { label: "Titre du service", name: "titre", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Actif", name: "actif", widget: "boolean", default: true }
      - { label: "Tarif (laisser vide si aucun)", name: "tarif", widget: "string", required: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 0 }

  - name: "portfolio"
    label: "Portfolio"
    folder: "src/content/portfolio"
    create: true
    fields:
      - { label: "Titre du projet", name: "titre", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Catégorie", name: "categorie", widget: "string" }
      - { label: "Image de couverture", name: "image_couverture", widget: "image" }
      - { label: "Images/vidéos complémentaires", name: "medias", widget: "list", field: { label: "Fichier", name: "fichier", widget: "file" }, required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Lien externe", name: "lien", widget: "string", required: false }
      - { label: "Compétences utilisées", name: "competences_utilisees", widget: "list", field: { label: "Compétence", name: "valeur", widget: "string" }, required: false }
      - label: "Statut"
        name: "statut"
        widget: "select"
        options: ["brouillon", "publié"]
        default: "brouillon"

  - name: "langues"
    label: "Langues"
    folder: "src/content/langues"
    create: true
    fields:
      - { label: "Langue", name: "langue", widget: "string" }
      - { label: "Niveau", name: "niveau", widget: "string" }

  - name: "parametres"
    label: "Paramètres & SEO"
    files:
      - name: "seo"
        label: "Référencement"
        file: "src/content/seo.json"
        fields:
          - { label: "Titre SEO par défaut", name: "titre_seo", widget: "string" }
          - { label: "Description SEO", name: "description_seo", widget: "text" }
          - { label: "Image de partage social", name: "image_partage", widget: "image", required: false }
